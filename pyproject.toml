[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-magcapposevlm"
version = "0.1.0"
description = "Multifunctional photoacoustic vision-language perception for capsule pose estimation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "accelerate>=1.0",
  "bitsandbytes>=0.45",
  "joblib>=1.3",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "peft>=0.14",
  "pillow>=10",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.57",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
